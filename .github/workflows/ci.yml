name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle distributions and dependencies, validates the wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` assembles and runs the full JUnit suite (analysis, parser,
      # profiles incl. QuerySearchServiceTest, schema, evidence)
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: build/reports/tests/test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p src/tsconfig.app.json

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      # In the SAME job as the build, on purpose. The e2e suite this replaces
      # needed MySQL, Spring Boot and docker compose, so it would have needed a
      # job with service containers — it never got one, was never run, and sat
      # Protractor-era long after Protractor was gone. This one serves the
      # build just produced above and stubs every backend call, so it costs one
      # browser download and nothing else (sqlx-6jy).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run e2e

      - name: Upload e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

# Let the backend reach RDS servers that use IAM database authentication.
#
#   docker compose -f docker-compose.yml -f docker-compose.rds.yml up -d sql-explorer
#
# with the servers in src/main/docker-local/config/application-rds.yml — see
# "RDS servers with IAM authentication" in docs/running-sql-explorer.md.
#
# Stacks with the local-build overlay; name both:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-build.yml \
#                  -f docker-compose.rds.yml up -d sql-explorer
#
# Two things, and nothing else:
#
# - ~/.aws, READ-ONLY, at the runtime user's home (/app). The JDBC wrapper's iam
#   plugin signs a fresh token per connection from the profile named in each
#   jdbcUrl, which resolves through the SSO token `aws sso login` caches on the
#   host. When that session lapses, run `aws sso login` on the host again; the
#   container sees the refreshed cache through this mount, no restart needed.
#   Read-only so the container can never rewrite your AWS config.
#
# - the `rds` profile, so Spring loads application-rds.yml. Set here rather than
#   in .env so the production servers exist only when this overlay is named.
#
# WHY IT IS A SEPARATE FILE. Mounting ~/.aws unconditionally would hand every
# run of the stack your AWS credentials, and on a machine without ~/.aws Docker
# would create an empty directory in its place.
services:
  sql-explorer:
    environment:
      ENVIRONMENT_PROFILE: override,rds
    volumes:
      - ${HOME}/.aws:/app/.aws:ro

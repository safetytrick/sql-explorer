# Serve the UI from a local `npm run build` instead of the image's baked bundle.
#
#   cd ui && npm run build && cd ..
#   docker compose -f docker-compose.yml -f docker-compose.ui-local.yml up -d explorer-ui
#
# Then every `npm run build` refreshes the running app on a hard reload, with
# no Docker step at all.
#
# WHY THIS EXISTS. `ui/Dockerfile` is two stages and only the *builder* needs
# `node:22`, which the daemon has repeatedly failed to pull through Docker
# Desktop's proxy (sqlx-dec — intermittent, so it reads as fixed right up until
# you need a rebuild). The nginx stage only copies a directory to
# /app/sql-explorer-ui, so mounting over that path skips the broken pull
# entirely while keeping the image's nginx and its /api proxy.
#
# The real cost of that bug was never the slow rebuild. It was that the running
# app silently lagged the code — a reported bug turned out to be a guard that
# simply was not in the bundle being run. This is the cheap way to stay current.
#
# WHY IT IS NOT `docker-compose.override.yml`. That name is applied
# automatically. It would shadow a genuine rebuild without saying so, and on a
# fresh clone — where ui/build does not exist — Docker would create an empty
# directory and nginx would serve 404s with no clue why. Opting in by naming
# the file is worth the extra flag.
services:
  explorer-ui:
    volumes:
      - ./ui/build/sql-explorer-ui/browser:/app/sql-explorer-ui:ro

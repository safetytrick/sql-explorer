import org.springframework.boot.gradle.plugin.SpringBootPlugin

buildscript {
    ext {
        springBootVersion = '3.2.3'
    }
    dependencies {
        classpath 'org.owasp:dependency-check-gradle:7.1.0.1'
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

plugins {
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
    id "com.github.spotbugs" version "5.0.7"
}

apply plugin: 'java'
apply plugin: 'com.github.spotbugs'
apply plugin: 'jacoco'
apply plugin: 'org.owasp.dependencycheck'
apply plugin: 'org.springframework.boot'

group = 'com.github.dbsqwerl'
version = '0.4.0'


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencyCheck {
        suppressionFile = file("suppression.xml")
    }

    test {
        useJUnitPlatform()
    }

    spotbugs {
        excludeFilter = rootProject.file("spotbugs-exclude-filter.xml")

    }
    spotbugsMain {
        reports {
            xml.enabled false
            html.enabled true
        }
    }
    spotbugsTest {
        reports {
            xml.enabled false
            html.enabled true
        }
    }


    tasks.register('dockerSourceCopy', Copy) {
        from "src/main/docker"
        into "${project.buildDir}/docker"
        dependsOn "assemble"
    }

    tasks.register('dockerLibCopy', Copy) {
        from "build"
        include "libs/*"
        into "${project.buildDir}/docker"
        dependsOn "assemble"
    }

    tasks.register('dockerStage') {
        dependsOn(dockerSourceCopy, dockerLibCopy)
    }

    jar.finalizedBy(dockerStage)
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "jakarta.inject:jakarta.inject-api:2.0.1.MR"
    implementation "jakarta.persistence:jakarta.persistence-api:3.1.0"
    implementation "jakarta.transaction:jakarta.transaction-api:2.0.1"
    implementation "jakarta.validation:jakarta.validation-api:3.0.2"
    implementation "jakarta.ws.rs:jakarta.ws.rs-api:3.1.0"
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation "org.springframework.boot:spring-boot-starter-validation:3.2.3"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core'
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations'

    implementation 'javax.inject:javax.inject:1'
    implementation("org.glassfish.jersey.core:jersey-server")

    implementation "org.hibernate.validator:hibernate-validator"
    
    implementation 'com.github.jsqlparser:jsqlparser:4.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    implementation 'com.google.guava:guava:33.0.0-jre'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveFileName = "sql-explorer.jar"
}


import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'jacoco'
    id "org.springframework.boot" version "4.0.6"
    id "org.owasp.dependencycheck" version "7.1.0.1"
    id "com.gorylenko.gradle-git-properties" version "4.0.1"
    id "com.github.spotbugs" version "6.1.3"
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
    // todo, get this working, it depends on being able to startup the application within the build process
    // id "org.springdoc.openapi-gradle-plugin" version "1.9.0"
}

group = 'com.github.dbsqwerl'
version = '0.4.0'


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

allprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyCheck {
        suppressionFile = file("suppression.xml")
    }

    test {
        useJUnitPlatform()
        // Testcontainers mounts the docker socket into its reaper container,
        // and must name it as the daemon's VM sees it. Colima's host-side
        // path cannot be mounted; /var/run/docker.sock is right for Colima,
        // Docker Desktop and CI alike. A value already set wins.
        if (!System.getenv('TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE')) {
            environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
        }
    }

    spotbugs {
        excludeFilter = rootProject.file("spotbugs-exclude-filter.xml")

    }
    spotbugsMain {
        reports {
            xml.required = false
            html.required = true
        }
    }
    spotbugsTest {
        reports {
            xml.required = false
            html.required = true
        }
    }
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "jakarta.inject:jakarta.inject-api"
    implementation "jakarta.persistence:jakarta.persistence-api"
    implementation "jakarta.transaction:jakarta.transaction-api"
    implementation "jakarta.validation:jakarta.validation-api"
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'tools.jackson.module:jackson-module-jakarta-xmlbind-annotations'

    implementation 'io.swagger.core.v3:swagger-annotations:2.2.49'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'

    implementation "org.hibernate.validator:hibernate-validator"

    implementation 'com.github.jsqlparser:jsqlparser:5.3'
    // MCP over streamable HTTP, served by this app at /api/sql-explorer/mcp
    implementation 'io.modelcontextprotocol.sdk:mcp-core:2.1.0'
    implementation 'io.modelcontextprotocol.sdk:mcp-json-jackson3:2.1.0'
    implementation 'tools.jackson.dataformat:jackson-dataformat-csv'

    implementation 'com.google.guava:guava:33.0.0-jre'
    // UUIDv7 for query-example ids: time-ordered, so `order by id desc` is
    // most-recent-first. java.util.UUID has no v7 factory and MySQL's UUID() is v1.
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // RDS IAM database authentication for analyzed servers: a server whose
    // jdbcUrl is `jdbc:aws-wrapper:mysql://…?wrapperPlugins=iam&awsProfile=…`
    // gets a freshly signed token on every new connection. A token is only
    // valid for 15 minutes, so writing one into config as a password would go
    // stale for every connection opened after that (sqlx-otn). The wrapper's
    // AWS SDK dependencies are all optional; these are the ones the iam plugin
    // needs, plus sso/ssooidc so an `aws sso login` profile resolves.
    runtimeOnly 'software.amazon.jdbc:aws-advanced-jdbc-wrapper:4.4.0'
    runtimeOnly platform('software.amazon.awssdk:bom:2.46.10')
    runtimeOnly 'software.amazon.awssdk:rds'
    runtimeOnly 'software.amazon.awssdk:sso'
    runtimeOnly 'software.amazon.awssdk:ssooidc'

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation('org.assertj:assertj-core:3.27.7')
    // the one test that boots the whole application, against a throwaway MySQL
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'

    implementation project(':models')
    implementation 'org.apache.avro:avro:1.12.1'
    implementation 'org.apache.parquet:parquet-common:1.15.2'
    implementation 'org.apache.parquet:parquet-encoding:1.15.2'
    implementation 'org.apache.parquet:parquet-column:1.15.2'
    implementation 'org.apache.parquet:parquet-avro:1.15.2'
    implementation 'org.apache.parquet:parquet-hadoop:1.15.2'
    implementation 'org.apache.hadoop:hadoop-common:3.5.0'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-core:3.5.0'

    implementation 'systems.manifold:manifold-ext-rt:2026.1.11'
    annotationProcessor 'systems.manifold:manifold-ext:2026.1.11'
    testAnnotationProcessor 'systems.manifold:manifold-ext:2026.1.11'
}

bootJar {
    archiveFileName = "sql-explorer.jar"
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.withType(JavaCompile).configureEach {
    // If you DO NOT define a module-info.java file:
    options.compilerArgs += ['-Xplugin:Manifold', '-implicit:class']
}


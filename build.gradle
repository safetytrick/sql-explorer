import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'jacoco'
    id "org.openrewrite.rewrite" version "latest.release"
    id "org.springframework.boot" version "4.0.6"
    id "org.owasp.dependencycheck" version "7.1.0.1"
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
    id "com.github.spotbugs" version "6.1.3"
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
    // todo, get this working, it depends on being able to startup the application within the build process
    // id "org.springdoc.openapi-gradle-plugin" version "1.9.0"
}

group = 'com.github.dbsqwerl'
version = '0.4.0'


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

rewrite {
    activeRecipe("org.openrewrite.java.spring.boot4.UpgradeSpringBoot_4_0")
    setExportDatatables(true)
}

allprojects {
    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyCheck {
        suppressionFile = file("suppression.xml")
    }

    test {
        useJUnitPlatform()
    }

    spotbugs {
        excludeFilter = rootProject.file("spotbugs-exclude-filter.xml")

    }
    spotbugsMain {
        reports {
            xml.required = false
            html.required = true
        }
    }
    spotbugsTest {
        reports {
            xml.required = false
            html.required = true
        }
    }


    tasks.register('dockerSourceCopy', Copy) {
        from "src/main/docker"
        into project.layout.buildDirectory.dir('docker')
        dependsOn "assemble"
    }

    tasks.register('dockerLibCopy', Copy) {
        from "build"
        include "libs/*"
        into project.layout.buildDirectory.dir('docker')
        dependsOn "assemble"
    }

    tasks.register('dockerStage') {
        dependsOn(dockerSourceCopy, dockerLibCopy)
    }

    jar.finalizedBy(dockerStage)
}

dependencies {
    rewrite("org.openrewrite.recipe:rewrite-spring:6.32.0")

    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation "jakarta.inject:jakarta.inject-api"
    implementation "jakarta.persistence:jakarta.persistence-api"
    implementation "jakarta.transaction:jakarta.transaction-api"
    implementation "jakarta.validation:jakarta.validation-api"
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'tools.jackson.module:jackson-module-jakarta-xmlbind-annotations'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    implementation "org.hibernate.validator:hibernate-validator"

    // implementation 'org.duckdb:duckdb_jdbc:1.2.0'
    
    implementation 'com.github.jsqlparser:jsqlparser:4.1'
    implementation 'tools.jackson.dataformat:jackson-dataformat-csv'

    implementation 'com.google.guava:guava:33.0.0-jre'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("org.assertj:assertj-core:3.27.2")

    implementation project(':models')
    implementation 'org.apache.avro:avro:1.12.0'
    implementation 'org.apache.parquet:parquet-common:1.15.0'
    implementation 'org.apache.parquet:parquet-encoding:1.15.0'
    implementation 'org.apache.parquet:parquet-column:1.15.0'
    implementation 'org.apache.parquet:parquet-avro:1.15.0'
    implementation 'org.apache.parquet:parquet-hadoop:1.15.0'
    implementation 'org.apache.hadoop:hadoop-common:3.4.0'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-core:3.4.0'

    implementation 'systems.manifold:manifold-ext-rt:2026.1.6'
    annotationProcessor 'systems.manifold:manifold-ext:2026.1.6'
    testAnnotationProcessor 'systems.manifold:manifold-ext:2026.1.6'
}

bootJar {
    archiveFileName = "sql-explorer.jar"
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.withType(JavaCompile).configureEach {
    // If you DO NOT define a module-info.java file:
    options.compilerArgs += ['-Xplugin:Manifold', '-implicit:class']
}


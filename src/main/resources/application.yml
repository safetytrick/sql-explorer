# this config file is appropriate for configuration that should be the same for all environments, for instance setting
# the location on the classpath to find translation files, or enabling a library feature you depend on in code

server:
  port: 8080
  servlet:
    context-path: /api/sql-explorer


spring:
  application.name: "sql-explorer"
  profiles:
    include: secrets,override
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: "classpath:/db/migration/db.changelog-master.xml"
  jpa:
    open-in-view: true
  web:
    error:
      include-exception: true
      include-stacktrace: always

scalar:
  sources:
    - url: /api/sql-explorer/v3/api-docs
  page-title: Sql Explorer API

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

sql-explorer:
  trace-errors: false
  # How many environments keep their corpus in heap at once; 0 disables
  # eviction. An evicted environment rebuilds from its own captures on the next
  # read, so this bounds memory rather than dropping data. Measured: ~7.7 KB per
  # profile, so 10,000 profiles is ~77 MB and five environments would be ~380 MB
  # of a 512 MB heap. A deployment with fewer environments than this never
  # evicts anything.
  resident-environments: 3


# this config file is appropriate for configuration that should be the same for all environments, for instance setting
# the location on the classpath to find translation files, or enabling a library feature you depend on in code

server:
  port: 8080
  servlet:
    context-path: /api/sql-explorer
  # Honour X-Forwarded-Proto/-Port/-Host from a proxy on a private address (the
  # UI's nginx, a load balancer). Sign-in needs it: the OIDC callback URL is
  # built from the address the browser used, http://localhost:4200/... through
  # nginx, not the container's own :8080.
  forward-headers-strategy: native


spring:
  application.name: "sql-explorer"
  profiles:
    include: secrets,override
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: "classpath:/db/migration/db.changelog-master.xml"
  jpa:
    open-in-view: true
  web:
    error:
      include-exception: true
      include-stacktrace: always

scalar:
  sources:
    - url: /api/sql-explorer/v3/api-docs
  page-title: Sql Explorer API

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

sql-explorer:
  # Sign-in (sqlx-e13.1). `none`: no sign-in, every request is the legacy
  # `admin` user, as before; a warning at startup and a banner in the UI say
  # so. `oidc`: sign in through the client registration named `sql-explorer`
  # (spring.security.oauth2.client.registration.sql-explorer and its provider),
  # and the API answers 401 without a session. /mcp stays open either way until
  # personal access tokens (sqlx-e13.5). The dev-idp profile
  # (src/main/docker-local/config/application-dev-idp.yml) is a worked example.
  auth:
    mode: none
  trace-errors: false
  # How many environments keep their corpus in heap at once; 0 disables
  # eviction. An evicted environment rebuilds from its own captures on the next
  # read, so this bounds memory rather than dropping data. Measured: ~7.7 KB per
  # profile, so 10,000 profiles is ~77 MB and five environments would be ~380 MB
  # of a 512 MB heap. A deployment with fewer environments than this never
  # evicts anything.
  resident-environments: 3
  # Delete captures another capture already contains. Off by default: it removes
  # files, and the rule is only safe because it is structural — within a run of
  # captures the newest contains the others, across a Performance Schema reset it
  # contains nothing of them, so the capture before a reset is never pruned. A
  # count- or age-based policy would eventually delete exactly that one, which is
  # the only record of which queries ran before the reset.
  prune-redundant-captures: false
  # Offline restarts (sqlx-nbi). At startup an environment whose cache is fresh
  # is served from it with every server disconnected: no startup pull, schemas
  # from their snapshots, and nothing opens a connection until someone pulls
  # it. Fresh means every source has a usable capture no older than max-age and
  # every cluster has a schema snapshot; one stale or missing source and the
  # whole environment is pulled as before. 0 turns this off. offline: true
  # serves every environment from its cache whatever its age and pulls nothing
  # at startup. Scheduled pulls (pullCron) still run either way.
  cache:
    max-age: 24h
    offline: false


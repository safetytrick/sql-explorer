# Unset, OFFLINE_DUMMY_HOST is a name under `.invalid`, which by RFC 6761
# never resolves, so every connection fails at once.
environments:
  offline-dummy:
    explainEnabled: true
    servers:
      dummy-primary:
        roles: [primary]
        jdbcUrl: "jdbc:mysql://${OFFLINE_DUMMY_HOST:db.offline-dummy.invalid}:3306?connectTimeout=3000"
        username: root
        password: password
        sources:
          - type: x-statement-analysis
      dummy-replica:
        roles: [replica, sampling]
        jdbcUrl: "jdbc:mysql://${OFFLINE_DUMMY_HOST:db.offline-dummy.invalid}:3306?connectTimeout=3000"
        username: root
        password: password
        sources:
          - type: x-statement-analysis

# Sign-in through the dummy OIDC provider in dev-idp/ (sqlx-e13.1). Loaded
# only by the `dev-idp` profile:
#
#   in docker   docker-compose.dev-idp.yml sets SPRING_PROFILES_ACTIVE=dev-idp
#               on sql-explorer, and DEV_IDP_BACKCHANNEL to the in-network name
#   on the host -Dspring.config.additional-location=src/main/docker-local/config/
#               -Dspring.profiles.include=local,dev-idp
#
# The logins are in dev-idp/README.md; the password is the username.
#
# The endpoints are given one by one, never through issuer-uri. The browser
# and a backend in a container reach the IdP by different names, so the
# browser-facing ones (authorize, logout, the issuer every token names) use
# DEV_IDP_ISSUER and the back channel (token, JWKS, userinfo) uses
# DEV_IDP_BACKCHANNEL. On the host both are localhost. issuer-uri would also
# make Boot fetch discovery from inside the container, from localhost.
sql-explorer:
  auth:
    mode: oidc
    issuer: ${DEV_IDP_ISSUER:http://localhost:18190/idp}
    end-session-uri: ${DEV_IDP_ISSUER:http://localhost:18190/idp}/connect/logout

spring:
  security:
    oauth2:
      client:
        registration:
          sql-explorer:
            provider: dev-idp
            client-id: sql-explorer
            # a public client: no secret, so Spring uses PKCE (S256)
            client-authentication-method: none
            authorization-grant-type: authorization_code
            # under the context path: http://localhost:4200/api/sql-explorer/login/oauth2/code/sql-explorer
            # through the UI's nginx, :18180 directly. dev-idp registers both.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          dev-idp:
            authorization-uri: ${DEV_IDP_ISSUER:http://localhost:18190/idp}/oauth2/authorize
            token-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/oauth2/token
            jwk-set-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/oauth2/jwks
            user-info-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/userinfo
            user-name-attribute: sub

# The endpoints are given one by one, never through issuer-uri: the browser
# and a backend in a container reach the IdP by different names, and
# issuer-uri would make Boot fetch discovery from inside the container, from
# localhost.
sql-explorer:
  auth:
    mode: oidc
    anonymous: ["viewer:production"]
    issuer: ${DEV_IDP_ISSUER:http://localhost:18190/idp}
    end-session-uri: ${DEV_IDP_BROWSER_BASE:${DEV_IDP_ISSUER:http://localhost:18190/idp}}/connect/logout

spring:
  security:
    oauth2:
      client:
        registration:
          sql-explorer:
            provider: dev-idp
            client-id: sql-explorer
            # a public client: no secret, so Spring uses PKCE (S256)
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          dev-idp:
            authorization-uri: ${DEV_IDP_BROWSER_BASE:${DEV_IDP_ISSUER:http://localhost:18190/idp}}/oauth2/authorize
            token-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/oauth2/token
            jwk-set-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/oauth2/jwks
            user-info-uri: ${DEV_IDP_BACKCHANNEL:http://localhost:18190/idp}/userinfo
            user-name-attribute: sub

# this config file should contain non-secret environment specific configuration (visible to both development and devops)


environments:
  production:
    default: true

  # second environment backed by the local explorer database, used to exercise
  # environment switching (the X-Sql-Explorer-Environment header selects it)
  local:
    # EXPLAIN is allowed here and nowhere else. This environment points at the
    # disposable explorer-mysql container that docker compose brings up, so
    # planning a statement against it costs nothing and reaches nobody's data.
    # `regression` above is a real server and is deliberately left off — the
    # flag defaults to false, so leaving it unmentioned is what keeps it off.
    explainEnabled: true
    servers:
      explorer:
        jdbcUrl: "jdbc:mysql://explorer-mysql:3306"
        # Stated explicitly. Left off, the pool sends no user at all and the
        # driver falls back to mysql_native_password, which MySQL 8.4 removed —
        # so the connection fails with a message about a missing plugin rather
        # than about missing credentials. Not a secret: this is the disposable
        # compose container, and the same password is in docker-compose.yml.
        username: root
        password: password
        sources:
          - type: x-statement-analysis
      # A SECOND CONNECTION, pointing at the same container under another name.
      # Not redundancy — it is the only two-connection environment there is, and
      # the unused-index report's whole rule is "read on no connection", which a
      # single-server environment cannot exercise at all (sqlx-vjr).
      replica:
        jdbcUrl: "jdbc:mysql://explorer-mysql:3306"
        username: root
        password: password
        sources:
          - type: x-statement-analysis

datasources:
  explorer:
    jdbcUrl: "jdbc:mysql://explorer-mysql:3306/explorer"

parquet-sink:
  filename: /parquet/sql-repository.parquet

sql-explorer:
  # Michael, 2026-09-01. Captures accumulate one per pull; this deletes the ones
  # a newer capture already contains. Never the capture before a reset — see
  # CaptureRetention.
  prune-redundant-captures: true

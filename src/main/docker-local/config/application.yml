# this config file should contain non-secret environment specific configuration (visible to both development and devops)


environments:
  regression:
    default: true
    servers:
      primary:
        jdbcUrl: "jdbc:mysql://${DB_HOST}:3306"
        sources:
          - type: x-statement-analysis
  # second environment backed by the local explorer database, used to exercise
  # environment switching (the X-Sql-Explorer-Environment header selects it)
  local:
    servers:
      explorer:
        jdbcUrl: "jdbc:mysql://explorer-mysql:3306"
        sources:
          - type: x-statement-analysis

datasources:
  explorer:
    jdbcUrl: "jdbc:mysql://explorer-mysql:3306/explorer"

parquet-sink:
  filename: /parquet/sql-repository.parquet

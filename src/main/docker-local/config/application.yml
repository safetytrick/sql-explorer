environments:
  production:
    default: true

  local:
    explainEnabled: true
    servers:
      explorer:
        roles: [primary]
        jdbcUrl: "jdbc:mysql://explorer-mysql:3306"
        # Left off, the driver falls back to mysql_native_password, which MySQL
        # 8.4 removed, and fails on a missing plugin rather than on credentials.
        username: root
        password: password
        sources:
          - type: x-statement-analysis
      replica:
        roles: [replica, sampling]
        jdbcUrl: "jdbc:mysql://explorer-mysql:3306"
        username: root
        password: password
        sources:
          - type: x-statement-analysis

datasources:
  explorer:
    jdbcUrl: "jdbc:mysql://explorer-mysql:3306/explorer"

parquet-sink:
  filename: /parquet/sql-repository.parquet

sql-explorer:
  prune-redundant-captures: true

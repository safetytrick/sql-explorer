# Each value can be overridden from the environment, e.g. DEV_IDP_ISSUER.
server:
  # Under /idp so the UI's nginx can serve it on the app's own origin,
  # http://localhost:4200/idp, and nothing has to be reached on 18190 (see
  # README, "Behind the UI's nginx").
  servlet:
    context-path: /idp
    session:
      cookie:
        # Cookies are scoped by host, not port: under the default JSESSIONID
        # the IdP and a backend on another localhost port would overwrite
        # each other's session on every sign-in. Behind nginx the path (/idp)
        # keeps them apart as well.
        name: DEV_IDP_SESSION
  # Trust X-Forwarded-* from the proxy, so redirects (to the login form, back
  # to authorize) name localhost:4200 rather than the container's own port.
  forward-headers-strategy: native
  # The same port inside and outside the container, so the browser-facing and
  # in-network addresses differ only by hostname (see README, "Which issuer").
  port: 18190

dev-idp:
  # Direct, for bootRun. docker-compose.dev-idp.yml sets the proxied
  # http://localhost:4200/idp instead.
  issuer: http://localhost:18190/idp
  # Generated on first start and reused after, so a restart keeps tokens valid.
  # Relative to the working directory: dev-idp/ under bootRun, /app/data in the
  # container (a named volume). Git-ignored (.data/).
  key-file: .data/signing-key.json
  client-id: sql-explorer
  redirect-uris:
    # the backend's oauth2Login callback, under its registration id and its
    # servlet context path, at each address it is reached by: the UI's nginx
    # (or ng serve), a bare :8080, and :18180 (docker compose, and the `local`
    # profile on the host)
    - http://localhost:4200/api/sql-explorer/login/oauth2/code/sql-explorer
    - http://localhost:8080/api/sql-explorer/login/oauth2/code/sql-explorer
    - http://localhost:18180/api/sql-explorer/login/oauth2/code/sql-explorer
  # More origins sql-explorer is reached at, comma separated, such as a
  # tunnel: DEV_IDP_EXTRA_ORIGINS=https://tunnel.example.test. Each adds its
  # callback and its root to the lists here. Set it in .env (git-ignored), not
  # in a committed file.
  extra-origins: ${DEV_IDP_EXTRA_ORIGINS:}
  post-logout-redirect-uris:
    - http://localhost:4200/
    - http://localhost:8080/
    - http://localhost:18180/

<div class="view-header wrap">
  <span class="view-title">Schemas</span>
  @if (visible.length === schemas.length) {
    <span class="view-sub">{{schemas.length}} analyzed</span>
  } @else {
    <span class="view-sub">{{visible.length}} of {{schemas.length}}</span>
  }
  <app-tag-filter-strip [rows]="schemas" (filterChange)="onFilter($event)"></app-tag-filter-strip>

  <!-- Beside the filters, because the filters are what define the set. -->
  <app-bulk-tag-bar [targets]="bulkTargets" [count]="visible.length" [setLabel]="bulkLabel"
                    (changed)="onBulkChanged()"></app-bulk-tag-bar>
</div>

<div class="lens-card">
  <div class="table-scroll ledger-scroll">
    <app-schema-list-table [schemas]="visible" (tagsChanged)="onRowTagsChanged()"></app-schema-list-table>
  </div>
</div>

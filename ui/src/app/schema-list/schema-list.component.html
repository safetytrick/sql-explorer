<table class="table">
  <tr>
    <th class="rank-col">#</th>
    <th class="table-col">Name</th>
    <th class="table-tags">Tags</th>
    <th class="query-count"># of Queries</th>
    <th class="total-time">Total Query Time</th>
  </tr>
  @for (schema of schemas; track schema; let i = $index) {
    <tr>
      <td class="rank-col">{{i + 1}}</td>
      <td class="schema-col"><a routerLink="/tables/{{schema.name}}">{{schema.name}}</a></td>
      <td class="table-tags">@for (tag of schema.tags; track tag; let last = $last) {
        {{tag.name}}@if (!last) {
        ,
      }
    }</td>
    <td class="query-count">{{schema.numberOfQueries}}</td>
    <td class="total-time">
      <app-pico-view [duration]="schema.totalQueryTime"></app-pico-view>
    </td>
  </tr>
}
</table>

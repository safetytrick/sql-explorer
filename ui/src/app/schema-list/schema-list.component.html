<div class="view-header wrap">
  <span class="view-title">Schemas</span>
  @if (visible.length === schemas.length) {
    <span class="view-sub">{{schemas.length}} analyzed</span>
  } @else {
    <span class="view-sub">{{visible.length}} of {{schemas.length}}</span>
  }
  <a class="view-sub encodings-link" routerLink="/collations"
     title="tables grouped by the character sets and collations of their columns, and joins whose two sides differ">
    charsets &amp; collations ›</a>
  <app-tag-filter-strip [rows]="stripRows" (filterChange)="onFilter($event)"></app-tag-filter-strip>

</div>

<div class="lens-card">
  <div class="table-scroll ledger-scroll">
    <app-schema-list-table [schemas]="visible" [tagFilterInPlace]="true" (tagsChanged)="onRowTagsChanged()"></app-schema-list-table>
  </div>
</div>

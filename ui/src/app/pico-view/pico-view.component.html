<span>

  @if (duration / 100000000 < 10000) {
    <span>{{duration / 1000000000 | number: '1.0-1'}}ms</span>
  }
  @if (duration / 100000000 < 1200000 && duration / 100000000 > 10000) {
    <span>{{duration / 1000000000000 | number: '1.0-1'}}s</span>
  }
  @if (duration / 100000000 > 1200000) {
    <span>{{duration / 1000000000 | duration}}</span>
  }
</span>

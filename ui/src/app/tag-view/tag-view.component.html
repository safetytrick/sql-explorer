<div class="tag-view">
  <div class="tag-input-area">
    @for (tag of tags; track tag.id) {
      <span class="tag-chip"
            [style.background]="chipStyle(tag.name).background"
            [style.color]="chipStyle(tag.name).color">
        {{tag.name}} <span class="rx" title="remove tag" (click)="removeTag(tag)">×</span>
      </span>
    }
    <input placeholder="add tag…"
           [value]="tagInput"
           (input)="onInput($any($event.target).value)"
           (keydown.enter)="addTag(tagInput)">
  </div>
  @if (suggestions.length) {
    <div class="tag-sugg-wrap">
      @for (name of suggestions; track name) {
        <span class="tag-sugg-item" (mousedown)="addTag(name)">{{name}}</span>
      }
    </div>
  }
</div>

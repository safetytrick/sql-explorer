<table class="data-table ledger">
  <thead>
    <tr>
      <th class="rank-col">#</th>
      <th class="table-col">Name</th>
      <th class="table-tags">Tags</th>
      <th class="query-count num"><span class="term" [title]="glossary.schemaQueries"># of Queries</span></th>
      <th class="total-time num"><span class="term" [title]="glossary.schemaTime">Total Query Time</span></th>
    </tr>
  </thead>
  <tbody>
    @for (schema of schemas; track schema; let i = $index) {
      <tr>
        <td class="rank-col">{{i + 1}}</td>
        <td class="schema-col"><a class="tbl-name" routerLink="/tables/{{schema.name}}">{{schema.name}}</a></td>
        <td class="table-tags">
          <app-tag-field [target]="schemaTarget(schema.name)" [tags]="schema.tags" [dense]="true"
                         (changed)="onRowTags(schema, $event)"></app-tag-field>
        </td>
        <td class="query-count num">{{schema.numberOfQueries}}</td>
        <td class="total-time num">
          <app-pico-view [duration]="schema.totalQueryTime"></app-pico-view>
          <div class="dur-bar" [style.width.%]="weight(schema.totalQueryTime)"></div>
        </td>
      </tr>
    }
  </tbody>
</table>

@if (schemas.length === 0) {
  <div class="card-empty">No schemas analyzed.</div>
}

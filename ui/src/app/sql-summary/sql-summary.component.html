<ul class="list-group">
  <li class="list-group-item">Status: {{query.queryActivityStatus}}</li>
  <li class="list-group-item">Last Seen: {{query.runtimeMetrics?.lastSeen}}</li>
  <li class="list-group-item">First Seen: {{query.runtimeMetrics?.firstSeen}}</li>
  <li class="list-group-item">
    Executed: {{query.runtimeMetrics.executed}}
  </li>
  <li class="list-group-item">
    Pain: <app-pico-view [duration]="query.runtimeMetrics.totalTime"></app-pico-view>
  </li>
  <li class="list-group-item">
    Average Scanned: {{query.runtimeMetrics.averageRowsScanned}}
  </li>
</ul>
<div *ngIf="query.mismatchedJoins.length > 0">
  <div>Mismatched Joins:</div>
  <ul class="list-unstyled">
    <li *ngFor="let join of query.mismatchedJoins">
      <div class="alert alert-danger">
        <div>
          <app-column-link [schema]="query.schemaName" [columnReference]="join[0]"></app-column-link>
        </div>
        <div>
          <app-column-link [schema]="query.schemaName" [columnReference]="join[1]"></app-column-link>
        </div>
      </div>
    </li>
  </ul>
</div>

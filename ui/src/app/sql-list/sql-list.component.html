<ol [attr.start]="offset + 1">
  @for (query of sqlList; track query; let i = $index) {
    <li>
      <div class="row">
        <div class="col-sm-8">
          @if (query.digest) {
            <a routerLink="/analyzed-sql/{{query.digest}}">{{query.id}}</a>
          }
          @if (!query.digest) {
            <a routerLink="/analyzed-sql/{{query.id}}">{{query.id}}</a>
          }
          @if (query.analysisFailed && query.analysisFailureReason) {
            <div class="bg-warning"><pre style="max-height: 40px">{{query.analysisFailureReason}}</pre></div>
          }
          <pre><code highlight="{{query.query}}"></code></pre>
        </div>
        <div class="col-sm-4">
          <app-sql-summary [query]="query"></app-sql-summary>
        </div>
      </div>
    </li>
  }
</ol>

<nav class="d-flex justify-content-between align-items-center my-3">
  <button class="btn btn-secondary btn-sm" (click)="previousPage()" [disabled]="offset === 0">Previous</button>
  <span class="text-muted">{{ offset + 1 }}–{{ offset + sqlList.length }}</span>
  <button class="btn btn-secondary btn-sm" (click)="nextPage()" [disabled]="!hasNextPage">Next</button>
</nav>

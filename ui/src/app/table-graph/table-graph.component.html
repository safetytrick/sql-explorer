@if (!dataReceived) {
  <div>Loading Table Graph...</div>
}

@if (dataReceived) {
  <div>
    <ngx-graph
      class="chart-container"
      [showMiniMap]="true"
      [links]="links"
      [nodes]="nodes"
      [clusters]="clusters"
      [layout]="layout"
      [draggingEnabled]="false"
      >
      <ng-template #defsTemplate>
        <svg:marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="4" markerHeight="4" orient="auto">
          <svg:path d="M0,-5L10,0L0,5" class="arrow-head" />
          </svg:marker>
        </ng-template>
        <ng-template #clusterTemplate let-cluster>
          <svg:g class="node cluster">
            <svg:rect rx="5" ry="5" style="stroke: black;stroke-width: 5;" [attr.width]="cluster.dimension.width" [attr.height]="cluster.dimension.height" [attr.fill]="'none'" />
            </svg:g>
          </ng-template>
          <ng-template #nodeTemplate let-node>
            <svg:g class="node">
              <svg:rect [attr.width]="node.dimension.width" [attr.height]="node.dimension.height" [attr.fill]="node.data.color" />
              <svg:text style="font-size:20px" alignment-baseline="central" [attr.x]="10" [attr.y]="(node.dimension.height / 2) + 5">{{node.label}}</svg:text>
                </svg:g>
              </ng-template>
              <ng-template #linkTemplate let-link>
                <svg:g class="edge">
                  <svg:path class="line" stroke-width="2" marker-end="url(#arrow)">
                    </svg:path>
                    <svg:text class="edge-label" text-anchor="end">
                      <a [attr.xlink:href]="'/table/' + link.source.split('.').join('/') + '/join/' + link.target.split('.').join('/')">
                        <textPath class="text-path" [attr.href]="'#' + link.id" [style.dominant-baseline]="link.dominantBaseline" startOffset="97%">
                          {{link.source}} {{link.label}}
                        </textPath>
                      </a>
                      </svg:text>
                      </svg:g>
                    </ng-template>
                  </ngx-graph>
                </div>
              }

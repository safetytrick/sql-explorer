<nav class="navbar">
  <a class="navbar-brand" routerLink="/schemas">Schemas</a>
  <a class="navbar-brand" routerLink="/tables">Tables</a>
  <a class="navbar-brand" routerLink="/queries">Queries</a>
  <a class="navbar-brand" routerLink="/graph">Graph</a>
  <a class="navbar-brand" routerLink="/unqueried">Unqueried</a>
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" (click)="toggleExplain()">Explain</a>
    </li>
    <li>
      <a class="nav-link" routerLink="/tags">Tags</a>
    </li>
    <li>
      <a class="nav-link" routerLink="/query-utilities">Query Utilities</a>
    </li>
    <li class="nav-item dropdown">
      <!-- was Bootstrap's data-toggle="dropdown"; toggled in the component now
           so the nav carries no Bootstrap JS dependency -->
      <a class="nav-link dropdown-toggle" role="button" tabindex="0"
         [attr.aria-expanded]="adminOpen" aria-haspopup="true"
         (click)="toggleAdmin($event)" (keydown.enter)="toggleAdmin($event)">
        Admin
      </a>
      @if (adminOpen) {
        <div class="dropdown-menu">
          <a class="dropdown-item" routerLink="/admin/sources" (click)="closeAdmin()">Sources</a>
        </div>
      }
    </li>
    @if (environments.length > 0) {
      <li class="nav-item">
        <select class="nav-environment-select" title="Environment"
                (change)="onEnvChange($any($event.target).value)">
          @for (env of environments; track env.name) {
            <option [value]="env.name" [selected]="env.name === current">{{env.name}}</option>
          }
        </select>
      </li>
    }
    <li class="nav-item">
      <select class="nav-environment-select" title="Color theme"
              (change)="onThemeChange($any($event.target).value)">
        @for (theme of themes; track theme.id) {
          <option [value]="theme.id" [selected]="theme.id === currentTheme">{{theme.label}}</option>
        }
      </select>
    </li>
  </ul>


</nav>

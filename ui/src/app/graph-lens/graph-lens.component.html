<div class="graph-wrap" #wrap>
  <canvas #graphCanvas
          [class.grabbing]="false"
          (mousedown)="onMouseDown($event)"
          (mousemove)="onMouseMove($event)"
          (click)="onClick($event)"
          (wheel)="onWheel($event)"></canvas>

  <div class="graph-toolbar">
    <select class="schema-select" [(ngModel)]="schema" (change)="onSchemaChange()">
      @for (name of schemaNames; track name) {
        <option [value]="name">{{name}}</option>
      }
    </select>
    <button class="btn" (click)="zoom(1.2)">+</button>
    <button class="btn" (click)="zoom(0.83)">−</button>
    <button class="btn" (click)="resetView()">reset</button>
    <button class="btn" [class.on]="layers.fk" (click)="toggle('fk')">FK</button>
    <button class="btn" [class.on]="layers.co" (click)="toggle('co')">co-query</button>
    <button class="btn" [class.on]="layers.self" (click)="toggle('self')">self-joins</button>
    @if (loading) { <span class="loading">loading…</span> }
  </div>

  <div class="graph-legend">
    <div class="leg-row"><div class="leg-line blue"></div> FK</div>
    <div class="leg-row"><div class="leg-dash"></div> co-query</div>
    <div class="leg-row"><div class="leg-line amber"></div> type mismatch</div>
  </div>

  <div class="minimap"><canvas #minimapCanvas width="150" height="100" (click)="onMinimapClick($event)"></canvas></div>
  <div class="graph-tooltip" #tooltip></div>
</div>

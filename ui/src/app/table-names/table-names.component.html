<div class="view-header wrap">
  <span class="view-title">Tables</span>
  @if (schema) {
    <span class="view-sub">in {{schema}}</span>
  }
  @if (visible.length === tables.length) {
    <span class="view-sub">{{tables.length}} analyzed</span>
  } @else {
    <span class="view-sub">{{visible.length}} of {{tables.length}}</span>
  }

  <!-- Hoisted out of app-table-list-component so the header is the page's one
       control strip. The component still owns the filtering; it is only the
       control that moved, and only for this page. -->
  @if (hasViews()) {
    <span class="type-scope">
      <span class="scope-label">show</span>
      <button type="button" class="tri-btn" [class.on]="typeFilter === 'all'"
              (click)="setTypeFilter('all')">all</button>
      <button type="button" class="tri-btn" [class.on]="typeFilter === 'tables'"
              (click)="setTypeFilter('tables')">tables</button>
      <button type="button" class="tri-btn" [class.on]="typeFilter === 'views'"
              (click)="setTypeFilter('views')">views</button>
    </span>
  }

  <app-tag-filter-strip [rows]="stripRows" (filterChange)="onFilter($event)"></app-tag-filter-strip>
</div>

<div class="lens-card">
  <div class="table-scroll ledger-scroll">
    <app-table-list-component [tables]="visible"
                              [typeFilter]="typeFilter"
                              [showTypeFilter]="false"
                              (tagsChanged)="onRowTagsChanged()"></app-table-list-component>
  </div>
</div>

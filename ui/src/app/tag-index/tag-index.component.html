
<h3>Query Tags</h3>
<hr>
<ul class="pill-cloud">
  <li *ngFor="let tag of queryTags">
    <a class="btn btn-primary" routerLink="/analyzed-sql/by-tag/{{tag}}">{{tag}}</a>
  </li>
</ul>
<hr>
<h3>Table Tags</h3>
<hr>
<ul class="pill-cloud">
  <li *ngFor="let tag of tableTags">
    <a class="btn btn-primary" routerLink="/tables/by-tag/{{tag}}">{{tag}}</a>
  </li>
</ul>

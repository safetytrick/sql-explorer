
@if (result) {
  <pre><code highlight="{{result}}"></code></pre>
}
<form id="query-utility">
  <div>
    <div>
      <label for="input">Query:</label>
    </div>
    <textarea id="input" [formControl]="inputControl"></textarea>
  </div>
  <button class="btn" id="clean" (click)="doClean()">Clean</button>
  <button class="btn" id="normalize" (click)="doNormalize()">Normalize</button>
</form>

<div class="small-sql">
  <div class="sql-col">
    <a class="mono q-link" routerLink="/analyzed-sql/{{query.digest || query.id}}">{{query.id}}</a>

    @if (query.analysisFailed && query.analysisFailureReason) {
      <div class="banner warn">
        <span class="banner-label">analysis failed</span>
        <pre class="banner-body">{{query.analysisFailureReason}}</pre>
      </div>
    }

    <pre class="sql-display"><code [sqlHighlight]="query.query"></code></pre>
  </div>
  <div class="meta-col">
    <!-- the metric list used to be duplicated here verbatim; it is one
         component now, so the two cannot drift apart again -->
    <app-sql-summary [query]="query"></app-sql-summary>
  </div>
</div>

<table class="table">
  <tr>
    <th class="rank-col">#</th>
    <th class="schema-col">Schema</th>
    <th class="table-col">Name</th>
    <th class="table-tags">Tags</th>
    <th class="query-count"># of Queries</th>
    <th class="total-time">Total Query Time</th>
  </tr>
  @for (table of tables; track table; let i = $index) {
    <tr>
      <td class="rank-col">{{i + 1}}</td>
      <td class="schema-col"><a routerLink="/tables/{{table.schema}}">{{table.schema}}</a></td>
      <td class="table-col"><a routerLink="/table/{{table.schema}}/{{table.name}}">{{table.name}}</a></td>
      <td class="table-tags">@for (tag of table.tags; track tag; let last = $last) {
        <a routerLink="/tables/by-tag/{{tag.name}}">{{tag.name}}</a>@if (!last) {
        ,
      }
    }</td>
    <td class="query-count">{{table.numberOfQueries}}</td>
    <td class="total-time">
      <app-pico-view [duration]="table.totalQueryTime"></app-pico-view>
    </td>
  </tr>
}
</table>

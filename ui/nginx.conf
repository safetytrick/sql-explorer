
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # What the browser used, for the backend and dev-idp to build redirects
    # with. Direct, that is http://localhost:4200. Behind a front proxy that
    # says so (a tunnel such as ngrok sends X-Forwarded-Proto: https and its
    # own Host), its values pass through: forcing http and 4200 sent a tunnel's
    # browser to http://<tunnel>:4200 after sign-in, which hangs. Trusting a
    # client's X-Forwarded-* is acceptable for this dev nginx only.
    map $http_x_forwarded_proto $fwd_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $fwd_host {
        ""      $host;
        default $http_x_forwarded_host;
    }
    map "$http_x_forwarded_proto|$http_x_forwarded_port" $fwd_port {
        "~^\|$"              4200;
        "~\|(?<given>\d+)$" $given;
        "~^https\|"          443;
        default              80;
    }

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        location /api/sql-explorer/ {
            proxy_pass http://sql-explorer:8080/api/sql-explorer/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $fwd_host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Port $fwd_port;
        }

        # The dev OIDC provider (dev-idp/, docker-compose.dev-idp.yml), on this
        # origin so the browser never leaves localhost:4200. Through a variable
        # and Docker's resolver so nginx still starts when dev-idp is not in the
        # stack: a literal upstream host is resolved at startup, and an unknown
        # one stops nginx. With a variable the path is passed as is, which is
        # right: the IdP serves under /idp too. Without dev-idp this is a 502.
        location /idp/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $dev_idp http://dev-idp:18190;
            proxy_pass $dev_idp;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $fwd_host;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Port $fwd_port;
        }

        location / {
            root   /app/sql-explorer-ui;
            index  index.html;
            # /index.html last, so the fallback is an internal redirect into the
            # location below rather than a file served from this one.
            try_files $uri $uri/ /index.html;
        }

        # index.html names the hashed bundles, so it is the one file that must
        # be revalidated: served with only Last-Modified, browsers cached it
        # heuristically, and a new tab after a rebuild could load the previous
        # bundle — a fixed bug looked unfixed (sqlx-dkq). Every deep link
        # reaches this through try_files above, and `/` through `index`. The
        # bundles themselves are named by content hash and safe to cache.
        location = /index.html {
            root   /app/sql-explorer-ui;
            add_header Cache-Control "no-cache";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}



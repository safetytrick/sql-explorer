# Adds `dev-idp`, a dummy OIDC identity provider with canned users, one per
# role (sqlx-e13.3). Development and e2e only. The logins, the groups claim
# and the client are in dev-idp/README.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-idp.yml up -d dev-idp
#
# Then http://localhost:4200/idp/.well-known/openid-configuration is
# discovery. Stacks with the other overlays (local-build, offline-dummy, rds).
#
# The image builds the jar itself. If the registry cannot be reached (sqlx-dec),
# build on the host and run the jar directly instead; it needs nothing else:
#
#   ./gradlew :dev-idp:bootJar && java -jar dev-idp/build/libs/dev-idp.jar
#
# EVERYTHING THROUGH :4200. The IdP serves under /idp and publishes no port;
# the UI's nginx proxies /idp/ to it (ui/nginx.conf), as it proxies
# /api/sql-explorer/ to the backend. So the browser sees one origin,
# http://localhost:4200, for the app, the login form and logout, and the
# issuer every token names is http://localhost:4200/idp.
#
# A backend in this compose network still cannot reach localhost:4200, which is
# its own container, so it takes the browser-facing authorization endpoint and
# issuer from config and uses http://dev-idp:18190/idp for the back channel
# (token, JWKS, userinfo). It cannot use issuer-uri discovery. The README has
# the details.
#
# SIGN-IN (sqlx-e13.1). The overlay also turns on the `dev-idp` profile for
# sql-explorer, which signs in through this IdP
# (src/main/docker-local/config/application-dev-idp.yml). That is what this
# file sets on it: the profile, the browser-facing issuer, and the in-network
# back channel. To run the whole stack signed in:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-build.yml \
#                  -f docker-compose.dev-idp.yml up -d
#
# then open http://localhost:4200 and sign in as viewer / viewer. Without this
# overlay the backend runs with sign-in off, and /idp/ on :4200 is a 502.
services:
  sql-explorer:
    environment:
      # active rather than ENVIRONMENT_PROFILE (the included ones), so this
      # stacks with overlays that set that, such as offline-dummy
      SPRING_PROFILES_ACTIVE: dev-idp
      DEV_IDP_ISSUER: ${DEV_IDP_ISSUER:-http://localhost:4200/idp}
      DEV_IDP_BACKCHANNEL: http://dev-idp:18190/idp
      # authorize and logout stay on the browser's own origin (nginx proxies
      # /idp/), so a tunnel works as well as localhost:4200
      DEV_IDP_BROWSER_BASE: /idp
    depends_on:
      - dev-idp

  dev-idp:
    build:
      context: .
      dockerfile: dev-idp/Dockerfile
    container_name: dev-idp
    image: sql-explorer/dev-idp
    # No ports: the browser reaches it through the UI's nginx on :4200, the
    # backend as dev-idp:18190. Add "18190:18190" here to call it directly.
    environment:
      DEV_IDP_ISSUER: ${DEV_IDP_ISSUER:-http://localhost:4200/idp}
      DEV_IDP_KEY_FILE: /app/data/signing-key.json
      # another origin the app is reached at, e.g. a tunnel; set in .env
      DEV_IDP_EXTRA_ORIGINS: ${DEV_IDP_EXTRA_ORIGINS:-}
      DEV_IDP_REMEMBER_FOR: ${DEV_IDP_REMEMBER_FOR:-90d}
    volumes:
      # the signing key, generated once and kept across container recreation
      - dev-idp-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://127.0.0.1:18190/idp/.well-known/openid-configuration"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  dev-idp-data:
